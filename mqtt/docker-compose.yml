services:
  mongo:
    image: mongo:7
    container_name: ccg-mongo
    restart: unless-stopped
    ports:
      - "27117:27017"
    volumes:
      - ccg_mongo_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ccg-mosquitto
    restart: unless-stopped
    ports:
      - "1893:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ccg_mosquitto_data:/mosquitto/data

volumes:
  ccg_mongo_data:
  ccg_mosquitto_data: